      <text x="35" y="68" fill="#64748b" font-family="monospace" font-size="10">VALOR EXTRAÍDO:</text>
      <text x="145" y="68" fill="#10b981" font-family="monospace" font-weight="bold" font-size="12">R$ 24.500,00</text>

      <text x="35" y="92" fill="#64748b" font-family="monospace" font-size="10">EMISSOR / BANCO:</text>
      <text x="145" y="92" fill="#f8fafc" font-family="sans-serif" font-size="11">Banco Itaú (Cód. 341)</text>

      <text x="35" y="116" fill="#64748b" font-family="monospace" font-size="10">VENCIMENTO:</text>
      <text x="145" y="116" fill="#f8fafc" font-family="monospace" font-size="11">15/Nov/2026 (D-15)</text>

      <text x="35" y="140" fill="#64748b" font-family="monospace" font-size="10">DESTINO FISCAL:</text>
      <text x="145" y="140" fill="#38bdf8" font-family="monospace" font-size="11">Custódia Bancária Ativa</text>

      <!-- WhatsApp Dispatch Notification Simulation -->
      <rect x="20" y="165" width="378" height="128" rx="8" fill="#0b1e16" stroke="#1b4d3e"/>
      <rect x="35" y="178" width="22" height="22" rx="6" fill="#25d366"/>
      <text x="41" y="194" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">W</text>
      <text x="65" y="193" fill="#25d366" font-family="sans-serif" font-weight="bold" font-size="12">WhatsApp Business API • Alerta Ativo</text>

      <rect x="35" y="210" width="348" height="70" rx="6" fill="#052e16"/>
      <text x="45" y="228" fill="#dcfce7" font-family="sans-serif" font-size="10">🔔 <tspan font-weight="bold">Aviso de Liquidação ENBK:</tspan></text>
      <text x="45" y="244" fill="#bbf7d0" font-family="sans-serif" font-size="10">"Cheque de R$ 24.500,00 vence em 48h (15/11)."</text>
      <text x="45" y="260" fill="#86efac" font-family="sans-serif" font-size="10">"Favor confirmar saldo em conta para compensação."</text>
      <text x="330" y="272" fill="#4ade80" font-family="monospace" font-size="9" text-anchor="end">✓✓ Entregue</text>
    </g>

    <!-- Bottom: Table of Processed Checks -->
    <g transform="translate(0, 390)">
      <rect x="0" y="0" width="928" height="200" rx="12" fill="#0d1322" stroke="#1e293b"/>
      <text x="20" y="28" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="13">Fila de Cheques &amp; Conciliação Automatizada</text>

      <rect x="20" y="44" width="888" height="24" rx="4" fill="#090d18"/>
      <text x="32" y="60" fill="#64748b" font-family="monospace" font-size="10">ID SCAN</text>
      <text x="140" y="60" fill="#64748b" font-family="monospace" font-size="10">BANCO &amp; CONTA</text>
      <text x="330" y="60" fill="#64748b" font-family="monospace" font-size="10">VALOR (R$)</text>
      <text x="480" y="60" fill="#64748b" font-family="monospace" font-size="10">BOM PARA</text>
      <text x="630" y="60" fill="#64748b" font-family="monospace" font-size="10">ALERTA WPP</text>
      <text x="790" y="60" fill="#64748b" font-family="monospace" font-size="10">STATUS</text>

      <!-- Row 1 -->
      <line x1="20" y1="102" x2="908" y2="102" stroke="#1e293b"/>
      <text x="32" y="92" fill="#c084fc" font-family="monospace" font-size="11">#SCN-8849</text>
      <text x="140" y="92" fill="#e2e8f0" font-family="sans-serif" font-size="11">Itaú • C/C 0924-8</text>
      <text x="330" y="92" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="11">R$ 24.500,00</text>
      <text x="480" y="92" fill="#94a3b8" font-family="monospace" font-size="11">15/11/2026</text>
      <text x="630" y="92" fill="#25d366" font-family="monospace" font-size="11">Agendado (D-2)</text>
      <rect x="790" y="78" width="84" height="20" rx="4" fill="#06b6d4" fill-opacity="0.15"/>
      <text x="802" y="92" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">EM CUSTÓDIA</text>

      <!-- Row 2 -->
      <line x1="20" y1="142" x2="908" y2="142" stroke="#1e293b"/>
      <text x="32" y="130" fill="#c084fc" font-family="monospace" font-size="11">#SCN-8848</text>
      <text x="140" y="130" fill="#e2e8f0" font-family="sans-serif" font-size="11">Bradesco • C/C 1209-1</text>
      <text x="330" y="130" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="11">R$ 18.900,00</text>
      <text x="480" y="130" fill="#94a3b8" font-family="monospace" font-size="11">02/11/2026</text>
      <text x="630" y="130" fill="#25d366" font-family="monospace" font-size="11">Notificado ✓✓</text>
      <rect x="790" y="116" width="84" height="20" rx="4" fill="#10b981" fill-opacity="0.15"/>
      <text x="806" y="130" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold">COMPENSADO</text>

      <!-- Row 3 -->
      <text x="32" y="172" fill="#c084fc" font-family="monospace" font-size="11">#SCN-8847</text>
      <text x="140" y="172" fill="#e2e8f0" font-family="sans-serif" font-size="11">Banco do Brasil • C/C 5541-0</text>
      <text x="330" y="172" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="11">R$ 41.200,00</text>
      <text x="480" y="172" fill="#94a3b8" font-family="monospace" font-size="11">28/10/2026</text>
      <text x="630" y="172" fill="#25d366" font-family="monospace" font-size="11">Notificado ✓✓</text>
      <rect x="790" y="158" width="84" height="20" rx="4" fill="#10b981" fill-opacity="0.15"/>
      <text x="806" y="172" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold">LIQUIDADO</text>
    </g>
  </g>
</svg>