<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="chequeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="waGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25d366"/>
      <stop offset="100%" stop-color="#128c7e"/>
    </linearGradient>
    <linearGradient id="chequePaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="scannerBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="scanGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="1200" height="675" rx="16" fill="url(#chequeBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Bar -->
  <rect width="1200" height="44" rx="16" fill="#090d18" stroke="#1e293b" stroke-width="1"/>
  <rect y="32" width="1200" height="12" fill="#090d18"/>
  
  <circle cx="28" cy="22" r="6" fill="#ef4444"/>
  <circle cx="48" cy="22" r="6" fill="#eab308"/>
  <circle cx="68" cy="22" r="6" fill="#22c55e"/>

  <rect x="240" y="8" width="720" height="28" rx="6" fill="#131b2e" stroke="#1e293b"/>
  <circle cx="260" cy="22" r="4" fill="#a855f7"/>
  <text x="275" y="27" fill="#94a3b8" font-family="monospace" font-size="12">https://ai.enbik.com/pipeline/vision-scanner</text>
  <rect x="910" y="14" width="38" height="16" rx="4" fill="#a855f7" fill-opacity="0.15"/>
  <text x="915" y="26" fill="#c084fc" font-family="monospace" font-size="10">AI-v2</text>

  <!-- Sidebar -->
  <rect x="0" y="44" width="220" height="631" fill="#0b101e" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Sidebar Brand -->
  <rect x="20" y="66" width="32" height="32" rx="8" fill="url(#aiGrad)"/>
  <text x="30" y="88" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="18">⚡</text>
  <text x="62" y="84" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="16">VISION</text>
  <text x="126" y="84" fill="#a855f7" font-family="sans-serif" font-weight="bold" font-size="16">AI</text>
  <text x="62" y="97" fill="#64748b" font-family="monospace" font-size="10">PIPELINE BANCÁRIO</text>

  <!-- Nav Items -->
  <rect x="14" y="125" width="192" height="34" rx="6" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.3"/>
  <text x="44" y="147" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="600">Scan &amp; Extração</text>

  <text x="44" y="187" fill="#94a3b8" font-family="sans-serif" font-size="12">Fila de Liquidação</text>
  <text x="44" y="227" fill="#94a3b8" font-family="sans-serif" font-size="12">Disparos WhatsApp</text>
  <text x="44" y="267" fill="#94a3b8" font-family="sans-serif" font-size="12">Conciliação Bancária</text>
  <text x="44" y="307" fill="#94a3b8" font-family="sans-serif" font-size="12">Modelos &amp; Acurácia</text>

  <!-- Stats Box in Sidebar -->
  <rect x="18" y="520" width="184" height="125" rx="8" fill="#131b2e" stroke="#1e293b"/>
  <text x="30" y="542" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">MÉTRICAS DO MODELO</text>
  <text x="30" y="565" fill="#e2e8f0" font-family="monospace" font-size="11">Acurácia OCR: <tspan fill="#10b981">99.4%</tspan></text>
  <text x="30" y="588" fill="#e2e8f0" font-family="monospace" font-size="11">Tempo Scan: <tspan fill="#38bdf8">1.2 seg</tspan></text>
  <text x="30" y="611" fill="#e2e8f0" font-family="monospace" font-size="11">Alertas Wpp: <tspan fill="#25d366">100% Entregue</tspan></text>
  <text x="30" y="632" fill="#64748b" font-family="monospace" font-size="9">Gemini Vision 2.5 Engine</text>

  <!-- Main Content -->
  <g transform="translate(240, 60)">
    <text x="0" y="22" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="20">Pipeline Inteligente de Processamento de Cheques</text>
    <text x="0" y="42" fill="#64748b" font-family="sans-serif" font-size="12">Leitura multimodal por visão computacional, validação de linha CMC7 e avisos via mensageria.</text>

    <!-- Top: The Scan Viewport (Left) & AI Engine Extraction (Right) -->
    <g transform="translate(0, 60)">
      
      <!-- Scan Viewport Box -->
      <rect x="0" y="0" width="490" height="310" rx="12" fill="#0d1322" stroke="#1e293b"/>
      <text x="20" y="28" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="13">Digitalização em Alta Resolução &amp; Bounding Boxes</text>
      
      <!-- Stylized Cheque Simulation -->
      <g transform="translate(25, 45)">
        <rect x="0" y="0" width="440" height="210" rx="8" fill="url(#chequePaper)" stroke="#94a3b8"/>
        <!-- Cheque Bank Header -->
        <rect x="15" y="12" width="120" height="24" rx="4" fill="#0f172a"/>
        <text x="25" y="28" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="11">BANCO ITAÚ S.A.</text>
        <text x="330" y="28" fill="#0f172a" font-family="monospace" font-weight="bold" font-size="14">R$ 24.500,00</text>
        
        <!-- Bounding Box for Amount (AI Detection) -->
        <rect x="315" y="10" width="115" height="28" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,2" filter="url(#scanGlow)"/>
        <text x="320" y="8" fill="#06b6d4" font-family="monospace" font-size="9" font-weight="bold">VALOR: 99.8%</text>

        <!-- Cheque Body Lines -->
        <text x="20" y="65" fill="#475569" font-family="sans-serif" font-size="10">Pague por este cheque a quantia de:</text>
        <text x="20" y="85" fill="#0f172a" font-family="cursive" font-size="14">Vinte e quatro mil e quinhentos reais ******************</text>
        
        <!-- Bounding Box for Payee -->
        <rect x="15" y="98" width="240" height="28" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,2"/>
        <text x="20" y="94" fill="#a855f7" font-family="monospace" font-size="9" font-weight="bold">BENEFICIÁRIO: 99.2%</text>
        <text x="20" y="118" fill="#0f172a" font-family="cursive" font-size="13">ENBK Soluções em Tecnologia Ltda</text>

        <text x="270" y="118" fill="#475569" font-family="sans-serif" font-size="10">Bom para: <tspan font-weight="bold" fill="#0f172a">15/11/2026</tspan></text>
        <rect x="265" y="102" width="165" height="24" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2"/>
        <text x="270" y="98" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">VENCIMENTO: 99.6%</text>

        <!-- Signature & MICR/CMC7 -->
        <path d="M 300 165 Q 330 145 360 160 T 400 155" fill="none" stroke="#0f172a" stroke-width="2"/>
        <text x="20" y="195" fill="#334155" font-family="monospace" font-size="11" letter-spacing="4">&lt;341&gt; 00192 88472 90184 10294</text>
      </g>

      <!-- Laser Scanner Beam Simulation -->
      <line x1="25" y1="150" x2="465" y2="150" stroke="#06b6d4" stroke-width="2" filter="url(#scanGlow)"/>

      <text x="20" y="295" fill="#38bdf8" font-family="monospace" font-size="11">Status: Foto processada via Gemini Vision • Metadados validados</text>
    </g>

    <!-- AI Extracted Fields & WhatsApp Alert (Right) -->
    <g transform="translate(510, 60)">
      <rect x="0" y="0" width="418" height="310" rx="12" fill="#0d1322" stroke="#1e293b"/>
      <text x="20" y="28" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="13">Extração Estruturada &amp; Disparo Automático</text>

