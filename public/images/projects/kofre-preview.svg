      <text x="890" y="160" fill="#f59e0b" font-family="monospace" font-size="11" text-anchor="end">$ 640 / $ 800 (80%)</text>
      <rect x="424" y="168" width="470" height="8" rx="4" fill="#1e293b"/>
      <rect x="424" y="168" width="376" height="8" rx="4" fill="#f59e0b"/>
