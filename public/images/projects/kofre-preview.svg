  <rect y="32" width="1200" height="12" fill="#090a12"/>
  
  <circle cx="28" cy="22" r="6" fill="#ef4444"/>
  <circle cx="48" cy="22" r="6" fill="#eab308"/>
  <circle cx="68" cy="22" r="6" fill="#22c55e"/>

  <rect x="240" y="8" width="720" height="28" rx="6" fill="#151926" stroke="#1e293b"/>
  <circle cx="260" cy="22" r="4" fill="#10b981"/>
  <text x="275" y="27" fill="#94a3b8" font-family="monospace" font-size="12">https://kofre.finance/vault/multi-currency</text>
