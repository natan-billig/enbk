  <text x="44" y="187" fill="#94a3b8" font-family="sans-serif" font-size="12">Carteiras &amp; Moedas</text>
  <text x="44" y="227" fill="#94a3b8" font-family="sans-serif" font-size="12">Cartões &amp; Faturas</text>
  <text x="44" y="267" fill="#94a3b8" font-family="sans-serif" font-size="12">Rateio &amp; Divisões</text>
