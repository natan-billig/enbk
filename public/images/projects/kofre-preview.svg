      <text x="890" y="80" fill="#10b981" font-family="monospace" font-size="11" text-anchor="end">R$ 5.000 / R$ 5.000 (100%)</text>
      <rect x="424" y="88" width="470" height="8" rx="4" fill="#1e293b"/>
      <rect x="424" y="88" width="470" height="8" rx="4" fill="#10b981"/>

      <!-- Category 2: Moradia & Custos Fixos -->
      <text x="424" y="120" fill="#cbd5e1" font-family="sans-serif" font-size="11">Custos Fixos &amp; Moradia</text>
      <text x="890" y="120" fill="#06b6d4" font-family="monospace" font-size="11" text-anchor="end">₲ 8.200k / ₲ 10.000k (82%)</text>
      <rect x="424" y="128" width="470" height="8" rx="4" fill="#1e293b"/>
      <rect x="424" y="128" width="385" height="8" rx="4" fill="#06b6d4"/>

