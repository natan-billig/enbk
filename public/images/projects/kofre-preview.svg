      <rect x="0" y="0" width="928" height="170" rx="12" fill="url(#cardDark)" stroke="#1e293b"/>
      <text x="24" y="26" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="13">Últimas Transações Conciliadas</text>

      <line x1="24" y1="44" x2="904" y2="44" stroke="#1e293b"/>
      
      <!-- Tx 1 -->
      <circle cx="44" cy="68" r="14" fill="#10b981" fill-opacity="0.15"/>
      <text x="40" y="72" fill="#34d399" font-family="sans-serif" font-size="12">↗</text>
      <text x="70" y="66" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="12">Aporte Tesouro / Reserva</text>
      <text x="70" y="80" fill="#64748b" font-family="sans-serif" font-size="10">Classificação: Investimentos • Conta BRL</text>
      <text x="900" y="72" fill="#10b981" font-family="monospace" font-weight="bold" font-size="13" text-anchor="end">+ R$ 2.500,00</text>

      <line x1="24" y1="96" x2="904" y2="96" stroke="#1e293b"/>

      <!-- Tx 2 -->
      <circle cx="44" cy="118" r="14" fill="#ef4444" fill-opacity="0.15"/>
      <text x="40" y="122" fill="#f87171" font-family="sans-serif" font-size="12">↘</text>
      <text x="70" y="116" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="12">Infraestrutura AWS / Vercel</text>
      <text x="70" y="130" fill="#64748b" font-family="sans-serif" font-size="10">Cartão Corporativo • Dólar Comercial</text>
      <text x="900" y="122" fill="#ef4444" font-family="monospace" font-weight="bold" font-size="13" text-anchor="end">- $ 149.00</text>
    </g>
