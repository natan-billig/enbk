<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="icon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="icon-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="icon-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="42" fill="#06b6d4" opacity="0.2" filter="url(#icon-glow)" />

  <!-- Top Face (Chevron) -->
  <polygon points="60,18 97,39 60,60 23,39" fill="url(#icon-cyan)" opacity="0.95" />
  <polygon points="60,22 91,39 60,56 29,39" fill="#0b0f17" opacity="0.45" />

  <!-- Left Face: "E" stepped bars -->
  <polygon points="20,44 57,65 57,77 20,56" fill="url(#icon-cyan)" />
  <polygon points="20,61 57,82 57,92 20,71" fill="url(#icon-cyan)" opacity="0.8" />
  <polygon points="20,76 57,97 57,108 20,87" fill="url(#icon-cyan)" opacity="0.6" />

  <!-- Right Face: "K" & "B" structure -->
  <polygon points="63,65 100,44 100,108 63,87" fill="url(#icon-dark)" stroke="#1e293b" stroke-width="1.5" />
  <polyline points="68,91 85,76 97,92" stroke="url(#icon-cyan)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <line points="85,76 97,60" stroke="url(#icon-emerald)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Central Quantum Spark -->
  <circle cx="60" cy="60" r="3.5" fill="#38bdf8" filter="url(#icon-glow)" />
  <circle cx="60" cy="60" r="1.5" fill="#ffffff" />
</svg>
