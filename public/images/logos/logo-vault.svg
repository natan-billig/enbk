<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" fill="none">
  <defs>
    <!-- Cyan to Emerald Gradient -->
    <linearGradient id="vault-cyan-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="vault-emerald-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="vault-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- QUANTUM VAULT / INFINITY MONOGRAM (Centered at X=75, Y=70) -->
  <g transform="translate(15, 10)">
    <!-- Ambient Glow behind symbol -->
    <circle cx="65" cy="60" r="45" fill="#06b6d4" opacity="0.2" filter="url(#vault-glow)" />

    <!-- Hexagonal Vault Frame (Outer Shield) -->
    <polygon points="65,16 105,39 105,85 65,108 25,85 25,39" 
             stroke="#1e293b" stroke-width="2" fill="#0b0f17" fill-opacity="0.8" />

    <!-- Infinity / Padlock Interwoven Ribbon -->
    <!-- Loop 1: Left Chamber (forming 'E' curve) -->
    <path d="M 65 32 
             C 42 32, 38 48, 38 60 
             C 38 72, 44 86, 65 86 
             C 80 86, 88 76, 92 68" 
          stroke="url(#vault-cyan-emerald)" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Loop 2: Right Chamber (forming 'B'/'K' interlock) -->
    <path d="M 65 32 
             C 88 32, 92 48, 92 60 
             C 92 72, 86 86, 65 86 
             C 50 86, 42 76, 38 68" 
          stroke="url(#vault-emerald-cyan)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.85" />

    <!-- Center Keyway / Quantum Core Node -->
    <circle cx="65" cy="59" r="6" fill="#06080d" stroke="url(#vault-cyan-emerald)" stroke-width="2.5" />
    <circle cx="65" cy="59" r="2.5" fill="#22d3ee" filter="url(#vault-glow)" />
    <!-- Downward Key Notch -->
    <line points="65,65 65,74" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- TYPOGRAPHY: "ENBK" -->
  <g transform="translate(160, 0)">
    <!-- Main Letters ENBK with modern geometric cuts -->
    <text x="0" y="78" fill="#f8fafc" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="52" font-weight="800" letter-spacing="3">
      ENBK
    </text>

    <!-- Subtitle -->
    <text x="2" y="102" fill="#10b981" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" font-weight="700" letter-spacing="3">
      FINTECH &amp; INTELLIGENT SYSTEMS
    </text>

    <!-- Architectural Badge -->
    <rect x="180" y="38" width="48" height="18" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="189" y="51" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" letter-spacing="1">v1.2</text>
  </g>
</svg>
