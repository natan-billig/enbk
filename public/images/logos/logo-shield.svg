<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" fill="none">
  <defs>
    <!-- Facet Gradients -->
    <linearGradient id="shield-top-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shield-top-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="shield-bot-left" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="shield-bot-right" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shield-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- APEX SHIELD / MATRIX FACETS (Centered at X=75, Y=70) -->
  <g transform="translate(15, 10)">
    <!-- Backlight Glow -->
    <polygon points="65,15 108,34 94,88 65,110 36,88 22,34" 
             fill="#06b6d4" opacity="0.16" filter="url(#shield-glow)"/>

    <!-- 4 Matrix Facets representing E - N - B - K -->
    <!-- Quadrant 1: Top-Left (E - Enterprise) -->
    <polygon points="63,20 28,36 38,58 63,58" fill="url(#shield-top-left)" stroke="#06080d" stroke-width="2" />
    <path d="M 38 42 L 53 42 M 38 49 L 49 49 M 38 54 L 53 54" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />

    <!-- Quadrant 2: Top-Right (N - Nexus / AI Vision) -->
    <polygon points="67,20 102,36 92,58 67,58" fill="url(#shield-top-right)" stroke="#06080d" stroke-width="2" />
    <polyline points="77,54 77,40 89,54 89,40" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- Quadrant 3: Bottom-Left (B - Banking / Fintech Kofre) -->
    <polygon points="63,62 39,62 47,88 63,103" fill="url(#shield-bot-left)" stroke="#06080d" stroke-width="2" />
    <path d="M 49 71 L 57 71 C 60 71 61 73 61 75 C 61 77 60 78 57 78 L 49 78 M 49 78 L 58 78 C 61 78 62 80 62 83 C 62 86 61 87 58 87 L 49 87" 
          stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9"/>
    <line points="49,70 49,88" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Quadrant 4: Bottom-Right (K - Kernel / Architecture) -->
    <polygon points="67,62 91,62 83,88 67,103" fill="url(#shield-bot-right)" stroke="#06080d" stroke-width="2" />
    <path d="M 74 70 L 74 88 M 84 70 L 74 79 L 85 88" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- Center Intersecting Matrix Cross -->
    <circle cx="65" cy="60" r="5" fill="#06080d" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="65" cy="60" r="2" fill="#22d3ee"/>
  </g>

  <!-- TYPOGRAPHY: "ENBK" -->
  <g transform="translate(160, 0)">
    <text x="0" y="78" fill="#f8fafc" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="52" font-weight="900" letter-spacing="3">
      ENBK
    </text>
    <text x="2" y="102" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="3.5">
      ENTERPRISE PLATFORMS &amp; SECURITY
    </text>
    
    <!-- Shield indicator dot -->
    <rect x="175" y="42" width="6" height="6" rx="1" fill="#38bdf8" />
  </g>
</svg>
