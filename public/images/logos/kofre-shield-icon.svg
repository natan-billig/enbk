<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="kicon-tl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="kicon-tr" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="kicon-bl" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="kicon-br" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="kicon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Backlight Emerald/Cyan Glow -->
  <polygon points="60,15 103,34 89,88 60,110 31,88 17,34" 
           fill="#10b981" opacity="0.22" filter="url(#kicon-glow)"/>

  <!-- 4 Matrix Facets -->
  <polygon points="58,20 23,36 33,58 58,58" fill="url(#kicon-tl)" stroke="#06080d" stroke-width="2" />
  <path d="M 33 42 L 48 42 M 33 49 L 44 49 M 33 54 L 48 54" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.95" />

  <polygon points="62,20 97,36 87,58 62,58" fill="url(#kicon-tr)" stroke="#06080d" stroke-width="2" />
  <polyline points="72,54 72,40 84,54 84,40" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

  <polygon points="58,62 34,62 42,88 58,103" fill="url(#kicon-bl)" stroke="#06080d" stroke-width="2" />
  <path d="M 44 71 L 52 71 C 55 71 56 73 56 75 C 56 77 55 78 52 78 L 44 78 M 44 78 L 53 78 C 56 78 57 80 57 83 C 57 86 56 87 53 87 L 44 87" 
        stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.95"/>
  <line points="44,70 44,88" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

  <polygon points="62,62 86,62 78,88 62,103" fill="url(#kicon-br)" stroke="#06080d" stroke-width="2" />
  <path d="M 69 70 L 69 88 M 79 70 L 69 79 L 80 88" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- Center Vault Core -->
  <circle cx="60" cy="60" r="5" fill="#06080d" stroke="#34d399" stroke-width="2"/>
  <circle cx="60" cy="60" r="2" fill="#34d399"/>
</svg>
