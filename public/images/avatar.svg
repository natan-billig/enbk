<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="cyberBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#06080d" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#cyberBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Circuit grid lines -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 4" opacity="0.35" />
  <circle cx="100" cy="100" r="55" fill="none" stroke="#10b981" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.25" />
  <line x1="100" y1="10" x2="100" y2="35" stroke="#22d3ee" stroke-width="1.5" opacity="0.6" />
  <line x1="100" y1="165" x2="100" y2="190" stroke="#10b981" stroke-width="1.5" opacity="0.6" />
  <line x1="10" y1="100" x2="35" y2="100" stroke="#06b6d4" stroke-width="1.5" opacity="0.6" />
  <line x1="165" y1="100" x2="190" y2="100" stroke="#06b6d4" stroke-width="1.5" opacity="0.6" />

  <!-- Tech Dots -->
  <circle cx="100" cy="35" r="3" fill="#22d3ee" />
  <circle cx="100" cy="165" r="3" fill="#10b981" />
  <circle cx="35" cy="100" r="3" fill="#06b6d4" />
  <circle cx="165" cy="100" r="3" fill="#06b6d4" />

  <!-- Initials NB -->
  <text x="100" y="112" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="46" font-weight="900" fill="url(#textGlow)" text-anchor="middle" letter-spacing="-1">NB</text>

  <!-- Subtitle -->
  <text x="100" y="138" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="3" opacity="0.85">ARCHITECT</text>
</svg>
